# Build e test a ogni push e pull request. Sul runner non c'e' TIA Portal: i worker
# Openness (V21, V18) si saltano da soli, si compilano app, librerie e test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TiaTracker.slnx -c Release

      - name: Test
        run: dotnet test tests/TiaTracker.Core.Tests/TiaTracker.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Risultati dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
